name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
      fail-fast: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: compile
        run: python -m py_compile skills/complexity/scripts/route.py skills/complexity/scripts/hooks/gate-agent.py
      - name: hook syntax
        run: bash -n skills/complexity/scripts/hooks/prompt-route.sh
      - name: unit tests
        run: python -m pytest tests/complexity -q -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: "1"

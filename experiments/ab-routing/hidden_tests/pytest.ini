[pytest]
# Anchors rootdir here regardless of invocation cwd, so the shared conftest.py
# (the --target option) and each taskN/conftest.py are always discovered.
markers =
    target: fails on the pristine fixture; this is what the task asks for
    guard: passes on the pristine fixture; a solution must not break it

# Suppress the Starlette/httpx TestClient deprecation noise (fastapi 0.141.1 /
# starlette 1.6.0 / httpx 0.28.1 on this machine) rather than letting it
# clutter every suite's output.
filterwarnings =
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore::DeprecationWarning:starlette.testclient
